packages:
  - packages/apps/**
  - packages/libs/**

overrides:
  decode-uri-component: 0.5.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Security floors scoped to affected releases; preserve other major versions.
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'seroval@<=1.6.2': 1.6.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'compression@<1.8.2': 1.8.2
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0
  'xcode>uuid': 11.1.1
  # Upgrade Metro's own image parser instead of breaking image-size's v1 API.
  'metro@0.84.4': 0.84.6
  'metro@0.87.0': 0.87.1

allowBuilds:
  # Pi's unused Google SDK preinstall is a no-op; protobufjs only prints a version warning.
  '@google/genai': false
  protobufjs: false
  better-sqlite3: true
  # Install the pinned compiler used by agent-runtime and its Docker build.
  bun: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true

catalog:
  "@types/node": ^25.8.0
  "@types/react": ^19.2.16
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.2
  "@playwright/test": ^1.62.1
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.101.2
  "@tanstack/react-router": ^1.170.31
  "@trpc/client": ^11.15.1
  "@trpc/server": ^11.15.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  react: ^19.2.7
  react-dom: ^19.2.3
  superjson: ^2.2.6
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.22.0
  typescript: ^6.0.3
  vite: ^8.2.0
  vitest: ^4.1.10
  zod: ^4.4.3

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@multiterm/release"
  - "@sandblocks/cli"
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
