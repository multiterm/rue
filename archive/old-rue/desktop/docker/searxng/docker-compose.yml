services:
  searxng:
    image: searxng/searxng:latest
    container_name: rue-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=rue
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
